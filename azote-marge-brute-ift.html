<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Azote, marge brute et IFT – BTS ACD</title>
<style>
:root{--bg:#fff;--fg:#1c2b22;--card:#f1f6f1;--bd:#b9c9bd;--g:#2e5e3e;--ok:#cfeccb;--ko:#f6d3cf;--in:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131915;--fg:#e6eee8;--card:#1c251f;--bd:#3b4b40;--g:#82c493;--ok:#245029;--ko:#5a2926;--in:#0f140f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131915;--fg:#e6eee8;--card:#1c251f;--bd:#3b4b40;--g:#82c493;--ok:#245029;--ko:#5a2926;--in:#0f140f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background:var(--bg);color:var(--fg);font:15px/1.45 Arial,Helvetica,sans-serif;max-width:1040px;padding:12px}
h1{font-size:21px;color:var(--g);margin:6px 0}h2{font-size:17px;color:var(--g);margin:18px 0 6px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
button{font:inherit;padding:7px 12px;border:1px solid var(--g);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer}
button.on,button.p{background:var(--g);color:var(--bg)}
.ctx,details,.mcq{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 12px;margin:8px 0}
.w{overflow-x:auto;max-width:100%}table{border-collapse:collapse;font-size:13px;margin:6px 0}
th{background:var(--g);color:var(--bg);padding:5px;font-weight:bold}td{border:1px solid var(--bd);padding:4px 6px;text-align:center}td:first-child{text-align:left}
th,td{border:1px solid var(--bd)}
input{width:72px;padding:4px;border:1px solid var(--bd);background:var(--in);color:var(--fg);border-radius:4px;text-align:center;font:inherit}
.ok{background:var(--ok)}.ko{background:var(--ko)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.sc{font-weight:bold}
.mcq label{display:block;padding:3px 0;cursor:pointer}.ex{font-size:13px;margin-top:4px}
</style></head><body>
<h1>🌾 Azote, marge brute et IFT – exercices BTS ACD</h1>
<div>Entraîne-toi aux séances 1 à 3 : saisis tes résultats dans les cases, puis clique sur « Vérifier ». Tolérance d’arrondi acceptée. Virgule ou point.</div>
<nav id="nav"></nav><div id="app"></div>
<script>
const R=(x,d=1)=>Math.round(x*10**d)/10**d, sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const fr=(x,d=2)=>String(R(x,d)).replace('.',',');
const A=(a,t=.1)=>({a,t});
// ---------- données
const D1=[['Blé tendre d’hiver',45,8,20,0,200],['Orge d’hiver',20,7,18,0,150],['Colza d’hiver',20,3.5,33,40,150],['Maïs grain',15,10.5,14,50,140],['Pois protéagineux',20,4.2,36,0,0]].map(x=>({n:x[0],s:x[1],r:x[2],t:x[3],o:x[4],m:x[5],p:x[4]+x[5],e:x[2]*x[3]}));
const D2=[['Blé tendre d’hiver',45,'Solution azotée 39 %',39,400,'Aucun',0,0,12,40,7.8,20],['Orge d’hiver',20,'Urée 46 %',46,250,'Aucun',0,0,12,30,6.9,18],['Colza d’hiver',20,'Ammonitrate 33,5 %',33.5,360,'Aucun',0,0,12,40,3.4,33],['Maïs grain',15,'Urée 46 %',46,150,'Lisier bovin : 30 m³/ha × 3,5 kg N/m³',30,3.5,12,40,10,14]].map(x=>{const nm=x[4]*x[3]/100,no=x[6]*x[7],en=nm+no+x[8]+x[9],ex=x[10]*x[11];return{n:x[0],s:x[1],eng:x[2]+' ('+x[3]+' %)',d:x[4],ef:x[5],nm,no,dp:x[8],mi:x[9],en,r:x[10],t:x[11],ex,b:en-ex}});
const D3=[['Blé tendre d’hiver',45,7.8,200,95,270,190,330],['Colza d’hiver',20,3.4,470,55,290,240,320],['Maïs grain',15,10,190,230,190,90,380]].map(x=>{const pb=x[2]*x[3],co=x[4]+x[5]+x[6];return{n:x[0],s:x[1],r:x[2],p:x[3],se:x[4],en:x[5],ph:x[6],me:x[7],pb,co,mb:pb-co,ms:pb-co-x[7]}});
const IB=[['H1 – Herbicide anti-graminées',1.5,2,100],['H2 – Herbicide anti-dicotylédones',.5,1,100],['R1 – Régulateur',.4,.8,100],['F1 – Fongicide 1er nœud',.8,1,100],['F2 – Fongicide dernière feuille',1,1.25,100],['I1 – Insecticide (bordures)',.3,.3,50]];
const IC=[['H1 – Herbicide prélevée',3,3,100],['H2 – Herbicide anti-graminées',.6,1,100],['I1 – Insecticide altises',.05,.1,100],['F1 – Fongicide sclérotinia',.5,1,100],['I2 – Insecticide méligèthes',.1,.1,100]];
const ift=(L,ref)=>{const v=L.map(l=>l[1]/l[2]*l[3]/100),T=sum(v,x=>x),H=sum(L.filter(l=>l[0][0]=='H'),l=>l[1]/l[2]*l[3]/100);return{h:['Produit','Dose appliquée (L/ha)','Dose homologuée (L/ha)','Surface traitée (%)','IFT du traitement'],r:[...L.map((l,i)=>[l[0],fr(l[1]),fr(l[2]),l[3],A(v[i],.01)]),[{x:'IFT total',c:4},A(T,.01)],[{x:'dont IFT herbicides',c:4},A(H,.01)],[{x:'Écart à la référence ('+fr(ref,1)+') en %',c:4},A((T-ref)/ref*100,.5)]]}};
const W=(a,f)=>sum(a,x=>f(x)*x.s)/sum(a,x=>x.s);
// ---------- séances
const SE=[
{t:'Séance 1 – Pression azotée et efficience',ctx:'EARL de Pink-Korgui (Bretagne, 120 ha, zone vulnérable). Calcule la pression azotée, l’azote exporté et l’efficience de chaque culture. Pour le pois, écris « nc » si le calcul est impossible.',f:'Pression azotée = N organique + N minéral (kg N/ha). N exporté = rendement × teneur. Efficience (%) = N exporté ÷ N apporté × 100. Moyenne d’exploitation : pondérée par les surfaces.',
 tabs:[{h:['Culture (surface)','Rendement (t/ha)','Teneur N (kg N/t)','N org (kg N/ha)','N min (kg N/ha)','Pression azotée (kg N/ha)','N exporté (kg N/ha)','Efficience (%)'],
 r:[...D1.map(x=>[x.n+' ('+x.s+' ha)',fr(x.r,1),x.t,x.o,x.m,A(x.p),A(x.e),x.p?A(x.e/x.p*100):A('nc')]),
 ['Exploitation (pondérée)','—','—',A(W(D1,x=>x.o)),'—',A(W(D1,x=>x.p)),A(W(D1,x=>x.e)),A(sum(D1,x=>x.e*x.s)/sum(D1,x=>x.p*x.s)*100)],
 [{x:'Efficience de l’exploitation hors pois (%)',c:7},A(sum(D1.slice(0,4),x=>x.e*x.s)/sum(D1.slice(0,4),x=>x.p*x.s)*100)]]}],
 q:[{q:'Une efficience de 107 % signifie…',o:['une erreur de calcul','la culture exporte plus d’azote qu’elle n’en a reçu : elle puise dans le stock du sol','des pertes d’azote très élevées'],a:1,e:'Exportation supérieure à l’apport : le sol est sollicité (minéralisation, reliquats).'},{q:'Pourquoi l’efficience du pois n’est-elle pas calculable ?',o:['le pois n’exporte pas d’azote','aucun apport (division par zéro) : l’azote vient de la fixation symbiotique et du sol','les légumineuses n’ont pas de rendement'],a:1,e:'Sans apport, le rapport n’a pas de sens ; le pois fixe l’azote de l’air.'}]},
{t:'Séance 2 – Bilan Global Azoté',ctx:'EARL de Pink-Korgui, 100 ha, démarche HVE. Calcule les entrées, les sorties et le BGA. Le maïs reçoit du lisier de bovins.',f:'N minéral = dose × titre ÷ 100. N organique = dose × teneur. Entrées = N min + N org + dépôts + minéralisation. Sorties = rendement × teneur. BGA = entrées − sorties. Repères : < 0 déficit ; 0–40 équilibre ; 40–80 excédent modéré ; > 80 excédent élevé.',
 tabs:[{h:['Culture (surface)','Engrais (titre)','Dose (kg/ha)','Effluent','N min','N org','Dépôts','Minér.','Entrées','Rdt (t/ha)','Teneur N (kg/t)','N exporté','BGA (kg N/ha)'],
 r:[...D2.map(x=>[x.n+' ('+x.s+' ha)',x.eng,x.d,x.ef,A(x.nm),A(x.no),x.dp,x.mi,A(x.en),fr(x.r,1),x.t,A(x.ex),A(x.b)]),
 ['Exploitation (pondérée)','—','—','—','—','—','—','—',A(W(D2,x=>x.en)),'—','—',A(W(D2,x=>x.ex)),A(W(D2,x=>x.b))],
 [{x:'BGA hors minéralisation, exploitation (kg N/ha)',c:12},A(W(D2,x=>x.b-x.mi))]]}],
 q:[{q:'Le BGA du maïs est de +86 kg N/ha. Lecture ?',o:['équilibre','déficit','excédent élevé : risque de pertes (nitrates, ammoniac)'],a:2,e:'Au-dessus de 80 kg N/ha : excédent élevé. Le maïs cumule urée et lisier.'},{q:'Si on retire la minéralisation des entrées, le BGA…',o:['augmente','diminue de la valeur de la minéralisation','ne change pas'],a:1,e:'Les entrées baissent de la minéralisation, donc le BGA aussi.'}]},
{t:'Séance 3 – Marge brute et IFT',ctx:'EARL de Pink-Korgui, 80 ha. Calcule produit brut, charges opérationnelles (sans la mécanisation), marge brute et marge semi-nette, puis les IFT du blé (référence 4,5) et du colza (référence 5,0).',f:'Produit brut = rendement × prix. Charges opérationnelles = semences + engrais + phyto. Marge brute = produit brut − charges opérationnelles. Marge semi-nette = marge brute − mécanisation. IFT = Σ (dose appliquée ÷ dose homologuée × % de surface traitée).',
 tabs:[{h:['Culture (surface)','Rdt (t/ha)','Prix (€/t)','Produit brut','Semences','Engrais','Phyto','Charges opérat.','Marge brute','Mécanis.','Marge semi-nette'],
 r:[...D3.map(x=>[x.n+' ('+x.s+' ha)',fr(x.r,1),x.p,A(x.pb,.5),x.se,x.en,x.ph,A(x.co,.5),A(x.mb,.5),x.me,A(x.ms,.5)]),
 [{x:'Marge pondérée (80 ha), en €/ha',c:8},A(W(D3,x=>x.mb)),'—',A(W(D3,x=>x.ms))]]},
 {title:'IFT du blé tendre',...ift(IB,4.5)},{title:'IFT du colza',...ift(IC,5)}],
 q:[{q:'La mécanisation fait-elle partie des charges opérationnelles ?',o:['oui','non : elle intervient dans la marge semi-nette','seulement pour le maïs'],a:1,e:'Les charges opérationnelles : semences, engrais, produits phytosanitaires.'},{q:'Traitement sur 50 % de la parcelle, à la dose homologuée : IFT ?',o:['1','0,5','2'],a:1,e:'1 × 50 % = 0,5.'}]}];
// ---------- rendu
const nav=document.getElementById('nav'),app=document.getElementById('app');let cur=0;
SE.forEach((s,i)=>{const b=document.createElement('button');b.textContent='Séance '+(i+1);b.onclick=()=>show(i);nav.append(b)});
function show(i){cur=i;[...nav.children].forEach((b,k)=>b.className=k==i?'on':'');const s=SE[i];app.innerHTML='';
 app.insertAdjacentHTML('beforeend','<h2>'+s.t+'</h2><div class="ctx">'+s.ctx+'</div><details><summary>Rappel des formules</summary><p>'+s.f+'</p></details>');
 s.tabs.forEach(t=>{if(t.title)app.insertAdjacentHTML('beforeend','<h2>'+t.title+'</h2>');
  const w=document.createElement('div');w.className='w';const tb=document.createElement('table');
  tb.innerHTML='<tr>'+t.h.map(h=>'<th>'+h+'</th>').join('')+'</tr>';
  t.r.forEach(r=>{const tr=document.createElement('tr');r.forEach(c=>{const td=document.createElement('td');
   if(c&&c.x!==undefined){td.textContent=c.x;td.colSpan=c.c;td.style.textAlign='right';td.style.fontWeight='bold'}
   else if(c&&c.a!==undefined){const n=document.createElement('input');n.dataset.a=c.a;n.dataset.t=c.t;n.setAttribute('aria-label','réponse');td.append(n)}
   else td.textContent=c;tr.append(td)});tb.append(tr)});
  w.append(tb);app.append(w)});
 app.insertAdjacentHTML('beforeend','<div class="bar"><button class="p" id="v">Vérifier</button><button id="c">Voir le corrigé</button><button id="x">Effacer</button><span class="sc" id="sc"></span></div><h2>Interprétation</h2>');
 s.q.forEach((q,k)=>{const d=document.createElement('div');d.className='mcq';d.innerHTML='<b>'+(k+1)+'. '+q.q+'</b>'+q.o.map((o,j)=>'<label><input type="radio" name="q'+k+'" value="'+j+'" style="width:auto"> '+o+'</label>').join('')+'<div class="ex"></div>';
  d.onchange=()=>{const v=+d.querySelector('input:checked').value;d.querySelector('.ex').textContent=(v==q.a?'✅ Correct. ':'❌ Pas tout à fait. ')+q.e};app.append(d)});
 const I=()=>[...app.querySelectorAll('td input')];
 document.getElementById('v').onclick=()=>{let ok=0;const L=I();L.forEach(n=>{const a=n.dataset.a,v=n.value.trim().toLowerCase().replace(',','.').replace(/\s/g,'');let g;
   if(isNaN(+a))g=['nc','n.c.','n.c','impossible'].includes(v);else g=v!==''&&!isNaN(+v)&&Math.abs(+v-+a)<=+n.dataset.t+1e-9;
   n.className=g?'ok':'ko';if(g)ok++});document.getElementById('sc').textContent='Score : '+ok+' / '+L.length+(ok==L.length?' 🎉 Bravo !':'')};
 document.getElementById('c').onclick=()=>I().forEach(n=>{n.value=isNaN(+n.dataset.a)?'nc':fr(+n.dataset.a,2);n.className='ok'});
 document.getElementById('x').onclick=()=>{I().forEach(n=>{n.value='';n.className=''});document.getElementById('sc').textContent=''}}
show(0);
</script></body></html>
